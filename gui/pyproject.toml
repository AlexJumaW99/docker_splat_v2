[project]
name = "docker-splat-gui"
version = "0.1.0"
description = "Desktop GUI for the docker_splat pipeline"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.0",
    "pydantic>=2.5",
    "pillow-heif>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
